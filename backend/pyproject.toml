[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "aiohttp>=3.9.0",
  "google-genai>=1.0.0",
  "python-dotenv>=1.0.0",
  "numpy>=1.26.0",
  "supabase>=2.5",
  "rank-bm25>=0.2.2",
  "faiss-cpu>=1.15.0",
  "requests>=2.34.2",
  "pymupdf>=1.28.2",
  "scikit-learn>=1.9.0",
  "python-multipart>=0.0.9",
  "python-jose[cryptography]>=3.3",
  "svix>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "I001",    # unsorted imports
    "BLE001",  # blind except
    "UP045",   # Optional[X] vs X | None
    "RUF012",  # mutable class defaults
    "DTZ005",  # datetime.now() without tz
    "ISC004",  # implicit string concat in collection
    "SIM117",  # nested with statements
    "S110",    # try-except-pass
    "SIM102",  # collapsible if
    "SIM103",  # needless bool
    "UP035",   # deprecated imports
    "UP041",   # timeout error alias
    "S112",    # try-except-continue
    "TRY004",  # type-check-without-type-error
    "UP006",   # List/Dict -> list/dict
    "UP017",   # datetime.timezone.utc
    "RUF022",  # unsorted __all__
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires live Supabase (deselect with '-m not integration')",
]
addopts = "-m 'not integration'"
